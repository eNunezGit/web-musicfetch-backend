# Proxy inverso para la API de MusicFetch.
#
# Instalar en la VM:
#   sudo cp nginx.conf /etc/nginx/sites-available/musicfetch
#   sudo ln -s /etc/nginx/sites-available/musicfetch /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# El subdominio se gestiona en freedns.afraid.org (registro A -> IP de la VM).
# Certbot reescribe este archivo al emitir el certificado: no añadas los
# bloques de SSL a mano.

server {
    listen 80;
    listen [::]:80;

    server_name api.musicfetch.chickenkiller.com;

    # Nginx habla con Node por localhost; el 3000 nunca se expone al exterior
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Sin esto, req.ip y los registros muestran 127.0.0.1 en vez de
        # la IP real del cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;
    }

    # No revelar la version de nginx en las cabeceras
    server_tokens off;
}
